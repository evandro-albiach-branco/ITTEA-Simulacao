<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IITEA — Mapa Nacional</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
}

#map {
  height:100vh;
}

/* caixa info (hover) */
.info {
  padding:8px 10px;
  background:white;
  border-radius:6px;
  font-size:13px;
  box-shadow:0 0 6px rgba(0,0,0,0.2);
}

/* legenda */
.legend i {
  width:16px;
  height:10px;
  float:left;
  margin-right:6px;
  opacity:0.8;
}
</style>
</head>

<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
// =============================
// 🧠 INICIALIZA MAPA
// =============================
const map = L.map('map', {
  preferCanvas:true
}).setView([-14,-52],4);

// base leve (tipo AdaptaBrasil)
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);

// =============================
// 🔢 FÓRMULA REAL IITEA
// =============================
function calcIITEA(M, Rel, MS){
  const fRel = 0.10 + 0.90*Math.pow(Rel, 0.70);
  const gMS = 0.70 + 0.30*MS;
  return Math.pow(M * fRel * gMS, 0.45);
}

// =============================
// 🎛️ PARÂMETROS (simulação)
// =============================
const state = {
  M: 0.5,
  Rel: 0.5,
  MS: 0.5
};

// =============================
// 🎨 CORES (5 classes + sd)
// =============================
function getColor(v){
  if(v === null) return '#d9d9d9';
  if(v >= 0.8) return '#d73027';
  if(v >= 0.6) return '#fc8d59';
  if(v >= 0.4) return '#fee08b';
  if(v >= 0.2) return '#91cf60';
  return '#1a9850';
}

// =============================
// 📊 INFO (hover)
// =============================
const info = L.control();

info.onAdd = function () {
  this._div = L.DomUtil.create('div', 'info');
  this.update();
  return this._div;
};

info.update = function (props) {
  this._div.innerHTML = props
    ? `<strong>${props.name}</strong><br>
       IITEA: ${props.iitea === null ? 'Sem dados' : props.iitea.toFixed(3)}`
    : 'Passe o mouse sobre um município';
};

info.addTo(map);

// =============================
// 🗺️ CARREGAR MUNICÍPIOS
// =============================
fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/brazil-municipalities.geojson')
.then(r => r.json())
.then(data => {

  // simulação com muitos "sd"
  data.features.forEach(f => {
    if(Math.random() < 0.6){
      f.properties.iitea = null;
    } else {
      f.properties.iitea = calcIITEA(
        Math.random(),
        Math.random(),
        Math.random()
      );
    }
  });

  let geojson;

  function style(feature){
    return {
      fillColor: getColor(feature.properties.iitea),
      weight: 0.2,
      color: '#ffffff',
      fillOpacity: 0.85
    };
  }

  function highlightFeature(e){
    const layer = e.target;

    layer.setStyle({
      weight: 1,
      color: '#000',
      fillOpacity: 1
    });

    info.update(layer.feature.properties);
  }

  function resetHighlight(e){
    geojson.resetStyle(e.target);
    info.update();
  }

  function onEachFeature(feature, layer){
    layer.on({
      mouseover: highlightFeature,
      mouseout: resetHighlight
    });
  }

  geojson = L.geoJson(data, {
    style,
    onEachFeature
  }).addTo(map);
});

// =============================
// 🧾 LEGENDA
// =============================
const legend = L.control({position: 'bottomright'});

legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'info legend');

  div.innerHTML += '<b>IITEA</b><br>';

  const grades = [0,0.2,0.4,0.6,0.8];

  grades.forEach((g,i)=>{
    div.innerHTML +=
      `<i style="background:${getColor(g+0.01)}"></i> ${g}–${grades[i+1] || 1}<br>`;
  });

  div.innerHTML += '<i style="background:#d9d9d9"></i> sd';

  return div;
};

legend.addTo(map);
</script>

</body>
</html>
