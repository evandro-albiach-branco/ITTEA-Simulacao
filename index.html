<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IITEA — Simulação Nacional</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
}

#map {
  height:100vh;
}

/* painel */
.panel {
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
  background:white;
  padding:12px;
  border-radius:10px;
  box-shadow:0 0 8px rgba(0,0,0,0.2);
  font-size:13px;
  width:220px;
}

/* info hover */
.info {
  padding:8px 10px;
  background:white;
  border-radius:6px;
  font-size:13px;
  box-shadow:0 0 6px rgba(0,0,0,0.2);
}

/* legenda */
.legend i {
  width:16px;
  height:10px;
  float:left;
  margin-right:6px;
  opacity:0.8;
}
</style>
</head>

<body>

<!-- 🎛️ CONTROLES -->
<div class="panel">
<b>Simulação IITEA</b><br><br>

M: <span id="valM">0.50</span><br>
<input type="range" min="0" max="1" step="0.01" value="0.5"
oninput="updateParam('M', this.value)">

<br><br>

Rel: <span id="valRel">0.50</span><br>
<input type="range" min="0" max="1" step="0.01" value="0.5"
oninput="updateParam('Rel', this.value)">

<br><br>

MS: <span id="valMS">0.50</span><br>
<input type="range" min="0" max="1" step="0.01" value="0.5"
oninput="updateParam('MS', this.value)">
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =============================
// 🧠 MAPA
// =============================
const map = L.map('map', { preferCanvas:true })
  .setView([-14,-52],4);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png')
  .addTo(map);

// =============================
// 🔢 FÓRMULA IITEA
// =============================
function calcIITEA(M, Rel, MS){
  const fRel = 0.10 + 0.90*Math.pow(Rel, 0.70);
  const gMS = 0.70 + 0.30*MS;
  return Math.pow(M * fRel * gMS, 0.45);
}

// =============================
// 🎛️ ESTADO
// =============================
const state = {
  M: 0.5,
  Rel: 0.5,
  MS: 0.5
};

// =============================
// 🎨 CORES
// =============================
function getColor(v){
  if(v === null) return '#d9d9d9';
  if(v >= 0.8) return '#d73027';
  if(v >= 0.6) return '#fc8d59';
  if(v >= 0.4) return '#fee08b';
  if(v >= 0.2) return '#91cf60';
  return '#1a9850';
}

// =============================
// 📊 INFO (hover)
// =============================
const info = L.control();

info.onAdd = function () {
  this._div = L.DomUtil.create('div', 'info');
  this.update();
  return this._div;
};

info.update = function (props) {
  this._div.innerHTML = props
    ? `<strong>${props.name}</strong><br>
       IITEA: ${props.iitea === null ? 'Sem dados' : props.iitea.toFixed(3)}`
    : 'Passe o mouse sobre um município';
};

info.addTo(map);

// =============================
// 🗺️ CAMADA
// =============================
let geojsonLayer;

// =============================
// 📦 CARREGAR MUNICÍPIOS
// =============================
fetch('https://raw.githubusercontent.com/codeforamerica/click_that_hood/master/public/data/brazil-municipalities.geojson')
.then(r => r.json())
.then(data => {

  data.features.forEach(f => {
    if(Math.random() < 0.6){
      f.properties.iitea = null;
    } else {
      f.properties.iitea = calcIITEA(
        Math.random(),
        Math.random(),
        Math.random()
      );
    }
  });

  geojsonLayer = L.geoJson(data, {
    style: styleFeature,
    onEachFeature
  }).addTo(map);
});

// =============================
// 🎨 STYLE
// =============================
function styleFeature(feature){
  return {
    fillColor: getColor(feature.properties.iitea),
    weight: 0.2,
    color: '#fff',
    fillOpacity: 0.85
  };
}

// =============================
// 🖱️ INTERAÇÃO
// =============================
function onEachFeature(feature, layer){
  layer.on({
    mouseover: e => {
      e.target.setStyle({ weight:1, color:'#000' });
      info.update(e.target.feature.properties);
    },
    mouseout: e => {
      geojsonLayer.resetStyle(e.target);
      info.update();
    }
  });
}

// =============================
// 🔄 ATUALIZAR MAPA
// =============================
function updateMap(){

  geojsonLayer.eachLayer(layer => {

    let val;

    if(Math.random() < 0.6){
      val = null;
    } else {
      val = calcIITEA(
        state.M,
        state.Rel,
        state.MS
      );
    }

    layer.feature.properties.iitea = val;

    layer.setStyle({
      fillColor: getColor(val)
    });

  });
}

// =============================
// 🎚️ SLIDERS
// =============================
function updateParam(param, value){

  state[param] = parseFloat(value);

  document.getElementById("val" + param).innerText =
    parseFloat(value).toFixed(2);

  updateMap();
}

// =============================
// 🧾 LEGENDA
// =============================
const legend = L.control({position: 'bottomright'});

legend.onAdd = function () {
  const div = L.DomUtil.create('div', 'info legend');

  div.innerHTML += '<b>IITEA</b><br>';

  const grades = [0,0.2,0.4,0.6,0.8];

  grades.forEach((g,i)=>{
    div.innerHTML +=
      `<i style="background:${getColor(g+0.01)}"></i> ${g}–${grades[i+1] || 1}<br>`;
  });

  div.innerHTML += '<i style="background:#d9d9d9"></i> sd';

  return div;
};

legend.addTo(map);

</script>

</body>
</html>
